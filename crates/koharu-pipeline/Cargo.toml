[package]
name = "koharu-pipeline"
version.workspace = true
edition.workspace = true
description.workspace = true
license = "MIT OR Apache-2.0 AND BSD-3-Clause"
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
# Booharu: the settings and attributes Booharu's pipeline hooks read.
booharu-core = { workspace = true }
bytesize = { workspace = true }
icu_experimental = { workspace = true }
icu_locale = { workspace = true }
icu_locale_core = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
indoc = { workspace = true }
koharu-config = { workspace = true }
koharu-llm = { workspace = true }
koharu-ml = { workspace = true }
koharu-renderer = { workspace = true }
koharu-runtime = { workspace = true }
koharu-scene = { workspace = true }
koharu-torch = { workspace = true }
kurbo = { workspace = true }
parking_lot = { workspace = true }
petgraph = { workspace = true }
rayon = { workspace = true }
# Booharu: the error a translation request gives, whose HTTP status tells a
# hosted reply koharu-llm already sent again from one worth another try.
rig-agent = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
fs-err = { workspace = true }
# Booharu: rig's scripted model, which answers a translation's turn in the
# tests of the words a run asks its model to stress.
rig-core = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
